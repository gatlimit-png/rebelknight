name: Build and Publish

on:
  push:
    branches:
      - master # Eğer ana dalınız main ise burayı main yapın
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # <-- ubuntu-latest yerine tam sürüm sürümü sabitledik
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v5
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Build Plugins via Gradle
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Deploy to Builds Branch
        run: |
          mkdir -p builds
          cp -r src/build/*.jar builds/ 2>/dev/null || cp -r src/*.jar builds/ 2>/dev/null || true
          cp src/plugins.json builds/ 2>/dev/null || cp src/repo.json builds/ 2>/dev/null || true
          cd builds
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "Automated build release" || true
          git push origin builds || true
